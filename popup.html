<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 340px; margin: 0; padding: 12px; font-size: 13px; color: #222; }
    label { display: block; margin-top: 8px; font-weight: 600; font-size: 12px; }
    select, input[type=text] { width: 100%; padding: 5px 6px; font-size: 13px; box-sizing: border-box; }
    button { padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .primary { background: #2563eb; color: white; border: none; border-radius: 4px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    #status { margin-top: 10px; font-size: 12px; min-height: 18px; }
    .ok { color: #059669; }
    .err { color: #b91c1c; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="no-config" style="display:none;">
    No repositories configured. <a href="#" id="open-options">Open options</a>.
  </div>

  <div id="main" style="display:none;">
    <label>Repository</label>
    <select id="repo"></select>

    <label>Folder</label>
    <input type="text" id="folder" placeholder="clippings">

    <label>Filename</label>
    <input type="text" id="filename">

    <div class="row">
      <button id="save" class="primary">Save as Markdown</button>
      <a href="#" id="open-options2" style="margin-left:auto;">Options</a>
    </div>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
