<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snip to Repo — Options</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 28px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
    input[type=text], input[type=password] { width: 100%; padding: 6px 8px; font-size: 14px; box-sizing: border-box; }
    .repo { border: 1px solid #ddd; padding: 12px; margin-top: 12px; border-radius: 6px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .primary { background: #2563eb; color: white; border: none; border-radius: 4px; }
    .danger { background: #fff; color: #b91c1c; border: 1px solid #b91c1c; border-radius: 4px; }
    #status { margin-top: 12px; color: #059669; font-size: 13px; }
    small { color: #666; font-weight: normal; }
  </style>
</head>
<body>
  <h1>Snip to Repo — Options</h1>

  <h2>GitHub Personal Access Token</h2>
  <label>Token <small>(needs <code>repo</code> or fine-grained Contents: read/write)</small></label>
  <input type="password" id="token" autocomplete="off">

  <h2>Repositories</h2>
  <div id="repos"></div>
  <button id="add" style="margin-top:12px;">+ Add repository</button>

  <div style="margin-top:20px;">
    <button id="save" class="primary">Save</button>
    <span id="status"></span>
  </div>

  <template id="repo-template">
    <div class="repo">
      <div class="row">
        <div>
          <label>Label</label>
          <input type="text" class="label" placeholder="My Notes">
        </div>
        <div>
          <label>Owner</label>
          <input type="text" class="owner" placeholder="username">
        </div>
        <div>
          <label>Repo</label>
          <input type="text" class="repo-name" placeholder="notes">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Branch</label>
          <input type="text" class="branch" placeholder="main">
        </div>
        <div>
          <label>Default folder <small>(e.g. <code>clippings</code>)</small></label>
          <input type="text" class="folder" placeholder="clippings">
        </div>
      </div>
      <div style="margin-top:8px;"><button class="danger remove">Remove</button></div>
    </div>
  </template>

  <script src="options.js"></script>
</body>
</html>
